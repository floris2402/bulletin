<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bulletin — Nouvelle semaine</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1F6FC9">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ecran">
    <header class="entete">
      <img src="assets/logo.png" alt="Logo" class="logo">
      <h1>Bulletin Individuel de Production</h1>
    </header>

    <main class="contenu">
      <div class="champ">
        <label for="editNom">Nom</label>
        <input type="text" id="editNom" autocomplete="family-name">
      </div>

      <div class="champ">
        <label for="editPrenom">Prénom</label>
        <input type="text" id="editPrenom" autocomplete="given-name">
      </div>

      <button class="texte" id="btnMail">✉️ Adresses mail</button>

      <hr class="separateur">

      <button class="secondaire pleine-largeur" id="btnChoisirLundi">Choisir le lundi de la semaine</button>
      <p class="texte-discret" id="textSemaineChoisie" style="margin-top:10px;"></p>

      <button class="texte" id="btnHistorique" style="margin-top: 20px;">🕘 Voir l'historique</button>
    </main>

    <footer class="pied">
      <button class="principal pleine-largeur" id="btnCommencer" disabled>Commencer la saisie</button>
    </footer>
  </div>

  <!-- Overlay Mail -->
  <div class="overlay-fond" id="overlayMail" style="display:none;">
    <div class="overlay-panneau">
      <h2>Adresses mail</h2>
      <div class="champ">
        <label for="editMailPrincipal">Mail principal</label>
        <input type="email" id="editMailPrincipal">
      </div>
      <div class="champ">
        <label for="editMailCopie">Mail en copie (optionnel)</label>
        <input type="email" id="editMailCopie">
      </div>
      <div class="overlay-boutons">
        <button class="secondaire" id="btnAnnulerMail">Annuler</button>
        <button class="principal" id="btnEnregistrerMail">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Sélecteur de date natif, caché, déclenché par le bouton "Choisir le lundi" -->
  <input type="date" id="selecteurDate" style="position:absolute; opacity:0; pointer-events:none; height:0;">

  <script src="js/date-utils.js"></script>
  <script src="js/preferences.js"></script>
  <script src="js/db.js"></script>
  <script src="js/nouvelle-semaine.js"></script>
</body>
</html>
